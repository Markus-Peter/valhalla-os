# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhallalinux
description: Custom Valhallalinux image based on Aurora-dx with Tuxedo and Audio/Superwhisper dependencies
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  - type: dnf
    repos:
      files:
        - files/tuxedo.repo   # Datei im Unterordner "files" des Repos commiten
      nonfree: rpmfusion
    install:
      packages:
        # 1. Dateimanager & Dropbox
        - nautilus
        - nautilus-dropbox

        # 2. Video & File Preview (Quick Look + Thumbnails)
        - ffmpegthumbnailer
        - gstreamer1-libav
        - sushi

        # 3. Tuxedo Control Center (Kernel-Treiber via tuxedo-drivers-kmod, s.u.)
        - tuxedo-control-center

        # 4. Logitech (Solaar + udev rules)
        - solaar

        # 5. Audio & Spracherkennung (Superwhisper & lokale Tools)
        - alsa-lib
        - pulseaudio-libs
        - portaudio
        - python3-pip
        - gcc
        - make

        # 6. Video Codecs & Multimedia (vollstaendig via RPM Fusion)
        - gstreamer1-plugins-good
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-openh264
        - libdvdcss
        - ffmpeg

  # Tuxedo-Kernelmodule als kmod-RPMs (akmods-Port), aus BrickMan240s Copr.
  # laedt die kmod-RPMs fuer den exakt passenden Kernel und installiert sie.
  - type: akmods
    settings:
      copr: brickman240/tuxedo-drivers-kmod
      modules:
        - tuxedo-drivers

  - type: default-flatpaks
    configurations:
      - install:
          # System & Permissions
          - com.github.tchx84.Flatseal
          - it.mijorus.gearlever

          # Office & Internet
          - net.mullvad.MullvadBrowser
          - org.onlyoffice.desktopeditors
          - com.rtosta.zapzap

          # Media, CAD & Video Conversion
          - com.obsproject.Studio
          - org.videolan.VLC
          - fr.handbrake.ghb
          - org.freecad.FreeCAD

          # 3D Printing
          - com.prusa3d.PrusaSlicer

  - type: signing
