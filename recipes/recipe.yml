# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhallalinux
description: Custom Valhallalinux image based on Aurora-dx with Tuxedo and Audio/Superwhisper dependencies
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  - type: dnf
    repos:
      files:
        - files/tuxedo.repo   # Datei im Unterordner "files" des Repos commiten
      nonfree: rpmfusion
    install:
      packages:
        # 1. Dateimanager & Dropbox
        - nautilus
        - nautilus-dropbox

        # 2. Video & File Preview (Quick Look + Thumbnails)
        - ffmpegthumbnailer
        - gstreamer1-libav
        - sushi

        # 3. Tuxedo Control Center (Kernel-Treiber via kmod, s.u.)
        - tuxedo-control-center

        # 4. Logitech (Solaar + udev rules)
        - solaar

        # 5. Audio & Spracherkennung (Superwhisper & lokale Tools)
        - alsa-lib
        - pulseaudio-libs
        - portaudio
        - python3-pip
        - gcc
        - make

        # 6. Video Codecs & Multimedia (vollstaendig via RPM Fusion)
        - gstreamer1-plugins-good
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-openh264
        - libdvdcss
        - ffmpeg

  # Tuxedo-Kernelmodule als kmod-RPMs aus BrickMan240s Copr (akmods-Port).
  # Laedt das zum laufenden Kernel passende RPM herunter und installiert es.
  - type: script
    snippets:
      - |
        set -euo pipefail
        KV=$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)
        curl -fsSL -o /tmp/kernel-modules-tuxedo-drivers.rpm \
          "https://download.copr.fedorainfracloud.org/results/brickman240/tuxedo-drivers-kmod/fedora-${FEDORA_VERSION}-x86_64/0*-kernel-modules-tuxedo-drivers/kernel-modules-tuxedo-drivers-*.${KV}.rpm"
        rpm-ostree install /tmp/kernel-modules-tuxedo-drivers.rpm
        rm -f /tmp/kernel-modules-tuxedo-drivers.rpm

  - type: default-flatpaks
    configurations:
      - install:
          # System & Permissions
          - com.github.tchx84.Flatseal
          - it.mijorus.gearlever

          # Office & Internet
          - net.mullvad.MullvadBrowser
          - org.onlyoffice.desktopeditors
          - com.rtosta.zapzap

          # Media, CAD & Video Conversion
          - com.obsproject.Studio
          - org.videolan.VLC
          - fr.handbrake.ghb
          - org.freecad.FreeCAD

          # 3D Printing
          - com.prusa3d.PrusaSlicer

  - type: signing
