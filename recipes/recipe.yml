# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: Valhallalinux
description: Custom Valhallalinux image based on Aurora-dx
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  - type: rpm-ostree
    repos:
      # Tuxedo drivers repository
      - https://copr.fedorainfracloud.org/coprs/tuxedo/tuxedo-drivers/repo/fedora-$version/tuxedo-tuxedo-drivers-fedora-$version.repo
    install:
      # 1. GNOME File Manager & Dropbox
      - nautilus
      - nautilus-dropbox
      
      # GNOME video & file preview (Spacebar quick look + thumbnails)
      - ffmpegthumbnailer
      - gstreamer1-libav
      - gnome-sushi

      # 3. Tuxedo Drivers & Control Center
      - tuxedo-drivers
      - tuxedo-control-center

      # 5. Solaar (Logitech manager with udev rules)
      - solaar

      # 6. Video Codecs & Multimedia (RPM Fusion basics)
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-openh264

  - type: default-flatpaks
    flatpaks:
      # System & Permissions
      - com.github.tchx84.Flatseal
      - it.mijorus.gearlever

      # Office & Internet
      - net.mullvad.MullvadBrowser
      - org.onlyoffice.desktopeditors
      - com.rtosta.zapzap

      # Media, CAD & Video Conversion
      - com.obsproject.Studio
      - org.videolan.VLC
      - fr.handbrake.ghb
      - org.freecad.FreeCAD

      # AI & 3D Printing
      - ai.lmstudio.LMStudio
      - com.prusa3d.PrusaSlicer

  # Optional signing module (by default, the GitHub workflow handles this step)
  - type: signing
