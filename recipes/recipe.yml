# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhallalinux
description: Custom Valhallalinux image based on Aurora-dx with Tuxedo and Audio/Superwhisper dependencies
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  # 1. tuxedo.repo lokal kopieren
  - type: copy
    src: tuxedo.repo
    dest: /etc/yum.repos.d/tuxedo.repo

  # 2. Alle dnf-Pakete (Kopr-Module werden separat geladen)
  - type: dnf
    repos:
      nonfree: rpmfusion

    install:
      skip-unavailable: true
      install-weak-deps: false
      packages:
        # 1. Dateimanager & Dropbox
        - nautilus
        - nautilus-dropbox

        # 2. Video & File Preview (Quick Look + Thumbnails)
        - ffmpegthumbnailer
        - sushi

        # 3. Tuxedo Control Center (Kernel-Module via script unten)
        - tuxedo-control-center

        # 4. Logitech
        - solaar

        # 5. Audio & Dev (alsa/pulse/portaudio kommen aus aurora-dx mit)
        - python3-pip
        - gcc
        - make

        # 6. Video Codecs & Multimedia (vollständig via RPM Fusion)
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-openh264

  # 7. DVD-Wiedergabe: libdvdcss liegt im "tainted"-Repo
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - rpmfusion-free-release-tainted
        - libdvdcss

  # 8. Tuxedo kmod: RPM aus dem neuesten Copr-Build laden
  - type: script
    snippets:
      - |
        set -euo pipefail
        COPR_URL="https://download.copr.fedorainfracloud.org/results/brickman240/tuxedo-drivers-kmod"
        # Finde die höchste verfügbare Fedora-Version, die Builds hat
        LATEST_FEDORA=$(curl -fsSL "$COPR_URL/" | grep -oP 'href="fedora-\K[0-9]+' | sort -rn | head -1)
        if [ -z "$LATEST_FEDORA" ]; then
          echo "ERROR: Keine Builds im Copr gefunden"
          exit 1
        fi
        echo "Nutze Copr-Build für Fedora $LATEST_FEDORA"
        BUILD_URL="${COPR_URL}/fedora-${LATEST_FEDORA}-x86_64/"
        RPM_URL=$(curl -fsSL "$BUILD_URL" | grep -oP 'href="\Kkernel-modules-core-tuxedo-drivers-[^"]+\.rpm' | tail -1)
        if [ -z "$RPM_URL" ]; then
          echo "ERROR: Kein kernel-modules-core-tuxedo-drivers RPM im Copr gefunden"
          exit 1
        fi
        echo "Downloading: $RPM_URL"
        curl -fsSL -o /tmp/kernel-modules-tuxedo-drivers.rpm "${BUILD_URL}${RPM_URL#/}"
        # Layer das RPM über dnf (der richtige Weg auf F41+ bootc/dnf5)
        dnf install -y --setopt=install_weak_deps=False /tmp/kernel-modules-tuxedo-drivers.rpm
        rm -f /tmp/kernel-modules-tuxedo-drivers.rpm
        echo "Tuxedo kmod installiert."

  # 9. Flatpaks
  - type: default-flatpaks
    system:
      install:
        - com.github.tchx84.Flatseal
        - it.mijorus.gearlever
        - net.mullvad.MullvadBrowser
        - org.onlyoffice.desktopeditors
        - com.rtosta.zapzap
        - com.obsproject.Studio
        - org.videolan.VLC
        - fr.handbrake.ghb
        - org.freecad.FreeCAD
        - com.prusa3d.PrusaSlicer

  # 10. Signierung
  - type: signing
