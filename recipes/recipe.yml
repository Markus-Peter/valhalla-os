# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhallalinux
description: Custom Valhallalinux image based on Aurora-dx
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  - type: dnf
    repos:
      files:
        # Official Tuxedo Computers repository for Fedora
        - https://rpm.tuxedocomputers.com/fedora/tuxedo.repo
      # Enable RPM Fusion nonfree to provide packages like nautilus-dropbox
      nonfree: rpmfusion
    install:
      # 1. GNOME File Manager & Dropbox
      - nautilus
      - nautilus-dropbox
      
      # 2. GNOME video & file preview (Spacebar quick look + thumbnails)
      - ffmpegthumbnailer
      - gstreamer1-libav
      - sushi

      # 3. Tuxedo Drivers & Control Center
      - tuxedo-drivers
      - tuxedo-control-center

      # 4. Solaar (Logitech manager with udev rules)
      - solaar

      # 5. Audio & Spracherkennungs-Abhängigkeiten (für Superwhisper & lokale Tools)
      - alsa-lib
      - pulseaudio-libs
      - portaudio
      - python3-pip
      - gcc
      - make

      # 6. Video Codecs & Multimedia (RPM Fusion basics)
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-openh264

  - type: default-flatpaks
    configurations:
      - install:
          # System & Permissions
          - com.github.tchx84.Flatseal
          - it.mijorus.gearlever

          # Office & Internet
          - net.mullvad.MullvadBrowser
          - org.onlyoffice.desktopeditors
          - com.rtosta.zapzap

          # Media, CAD & Video Conversion
          - com.obsproject.Studio
          - org.videolan.VLC
          - fr.handbrake.ghb
          - org.freecad.FreeCAD

          # 3D Printing
          - com.prusa3d.PrusaSlicer

  # Optional signing module (by default, the GitHub workflow handles this step)
  - type: signing
