# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhallalinux
description: Custom Valhallalinux image based on Aurora-dx with Tuxedo and Audio/Superwhisper dependencies
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  # Kopiert files/tuxedo.repo -> /usr/etc/yum.repos.d/tuxedo.repo
  - type: files
    files:
      - usr: /usr

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        # 1. Dateimanager & Dropbox
        - nautilus
        - nautilus-dropbox

        # 2. Video & File Preview (Quick Look + Thumbnails)
        - ffmpegthumbnailer
        - gstreamer1-libav
        - sushi

        # 3. Tuxedo Control Center (Kernel-Treiber via kmod, s.u.)
        - tuxedo-control-center

        # 4. Logitech (Solaar + udev rules)
        - solaar

        # 5. Audio & Spracherkennung (Superwhisper & lokale Tools)
        - alsa-lib
        - pulseaudio-libs
        - portaudio
        - python3-pip
        - gcc
        - make

        # 6. Video Codecs & Multimedia (vollstaendig via RPM Fusion)
        - gstreamer1-plugins-good
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-openh264
        - libdvdcss
        - ffmpeg

  - type: script
    snippets:
      - |
        set -euo pipefail
        KV=$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)
        echo "Kernel: $KV"
        COPR_URL="https://download.copr.fedorainfracloud.org/results/brickman240/tuxedo-drivers-kmod/fedora-$(rpm -E %fedora)-x86_64/"
        RPM_URL=$(curl -fsSL "$COPR_URL" | grep -oP 'href="\K[^"]*kernel-modules-tuxedo-drivers-[^"]+\.rpm' | tail -1)
        if [ -z "$RPM_URL" ]; then
          echo "ERROR: Kein kernel-modules-tuxedo-drivers RPM im Copr gefunden"
          exit 1
        fi
        echo "Downloading: $RPM_URL"
        curl -fsSL -o /tmp/kernel-modules-tuxedo-drivers.rpm "$COPR_URL/$RPM_URL"
        rpm-ostree install /tmp/kernel-modules-tuxedo-drivers.rpm
        rm -f /tmp/kernel-modules-tuxedo-drivers.rpm
        echo "Tuxedo kmod installiert."

  - type: default-flatpaks
    configurations:
      - install:
          - com.github.tchx84.Flatseal
          - it.mijorus.gearlever
          - net.mullvad.MullvadBrowser
          - org.onlyoffice.desktopeditors
          - com.rtosta.zapzap
          - com.obsproject.Studio
          - org.videolan.VLC
          - fr.handbrake.ghb
          - org.freecad.FreeCAD
          - com.prusa3d.PrusaSlicer

  - type: signing
