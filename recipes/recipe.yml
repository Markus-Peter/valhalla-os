# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: valhallalinux
description: Custom Valhallalinux image based on Aurora-dx with Tuxedo and Audio/Superwhisper dependencies
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest

modules:
  # 1. tuxedo.repo lokal kopieren
  - type: copy
    src: tuxedo.repo
    dest: /etc/yum.repos.d/tuxedo.repo

  # 2. Alle Pakete (kmod wird zur Laufzeit installiert, s. README)
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        - nautilus
        - nautilus-dropbox
        - ffmpegthumbnailer
        - sushi
        - tuxedo-control-center
        - solaar
        - python3-pip
        - gcc
        - make
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-openh264

  # 3. DVD-Wiedergabe
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - rpmfusion-free-release-tainted
        - libdvdcss

  # 4. Hinweis-Skript statt Installationsversuch
  - type: script
    snippets:
      - |
        cat > /usr/share/ublue-os/firstboot/valhalla-tuxedo-note.txt <<'EOF'
        Tuxedo-Kernel-Module werden NICHT ins Image gebaut.
        Grund: kein passendes COPR-Build fuer Fedora 45 verfuegbar.

        Nach dem Booten einmalig ausfuehren:

          sudo rpm-ostree usroverlay --hotfix
          sudo dnf install tuxedo-drivers
          sudo systemctl enable --now tccd

        Hinweis: nach jedem 'bootc switch' / grossen Update erneut ausfuehren.
        EOF

  # 5. Flatpaks
  - type: default-flatpaks
    system:
      install:
        - com.github.tchx84.Flatseal
        - it.mijorus.gearlever
        - net.mullvad.MullvadBrowser
        - org.onlyoffice.desktopeditors
        - com.rtosta.zapzap
        - com.obsproject.Studio
        - org.videolan.VLC
        - fr.handbrake.ghb
        - org.freecad.FreeCAD
        - com.prusa3d.PrusaSlicer

  # 6. Signierung
  - type: signing
